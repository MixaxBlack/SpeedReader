plugins { id 'com.android.application' }
android {
    namespace 'com.mixax.speedreader'
    compileSdk 35
    defaultConfig {
        applicationId 'com.mixax.speedreader'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.0.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        release {
            storeFile file(System.getenv('SPEEDREADER_KEYSTORE') ?: '../.runtime/speedreader.keystore')
            storePassword System.getenv('SPEEDREADER_STORE_PASSWORD') ?: 'android'
            keyAlias 'speedreader'
            keyPassword System.getenv('SPEEDREADER_KEY_PASSWORD') ?: 'android'
        }
    }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
}
dependencies {
    implementation 'com.google.android.material:material:1.12.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
