name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: speedreader-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SPEEDREADER_KEYSTORE: ${{ github.workspace }}/.android-signing/speedreader.keystore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: actions/cache/restore@v4
        id: signing
        with:
          path: ${{ env.SPEEDREADER_KEYSTORE }}
          key: speedreader-signing-v1
      - name: Initialize separate SpeedReader signing identity
        run: |
          if [ ! -f "$SPEEDREADER_KEYSTORE" ]; then
            mkdir -p "$(dirname "$SPEEDREADER_KEYSTORE")"
            keytool -genkeypair -keystore "$SPEEDREADER_KEYSTORE" -storepass android -keypass android -alias speedreader -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=SpeedReader,O=MixaxBlack,C=GE'
          fi
      - uses: actions/cache/save@v4
        if: steps.signing.outputs.cache-hit != 'true'
        with:
          path: ${{ env.SPEEDREADER_KEYSTORE }}
          key: speedreader-signing-v1
      - name: Build native APK and lint
        run: gradle --no-daemon :app:assembleRelease :app:assembleDebug :app:lintRelease :app:assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and test on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash scripts/test-android.sh
      - name: Test reports and device screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-verification
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
            verification/
          if-no-files-found: ignore
      - name: Verify signature and publish installable APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/SpeedReader-1.3.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs release/SpeedReader-1.3.0.apk | tee release/signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging release/SpeedReader-1.3.0.apk > release/apk-info.txt
          cd release && sha256sum SpeedReader-1.3.0.apk > SHA256SUMS && cd ..
          gh release view v1.3.0 || gh release create v1.3.0 --title 'SpeedReader 1.3.0' --notes-file docs/release-notes.md --target "$GITHUB_SHA"
          gh release upload v1.3.0 release/* --clobber
